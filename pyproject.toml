[project]
name = "maki"
version = "0.5.0"
description = "The Maki Blogging Engine"
authors = [{ name = "Joel Rivera", email = "rivera@joel.mx" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cherrypy>=18.10,<19",
    "mako>=1.3,<2",
    "sqlalchemy>=2.0,<3",
    "unidecode>=1.4",
    "docutils>=0.22",
    "pygments>=2.19",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
maki-run = "maki.scripts.run:main"
maki-shell = "maki.scripts.shell:run"

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
# same spirit as the old flake8 setup; the codebase predates
# f-strings-everywhere style and we don't want the churn.
select = ["E", "F", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maki"]
